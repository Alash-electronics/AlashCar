sentence=Robot car for any motor driver (L298N, TB6612, L9110S, DRV8833, BTS7960, Cytron), 2WD or 4WD: drive, turn, smooth ramp, failsafe, Bluetooth commands. No dependencies.
paragraph=Drives a four-wheel robot car (such as the Alash Phobo kit) with car.forward(70), car.turnRight(), car.drive(speed, turn) for a joystick and car.handleStream(bluetooth) for F, B, L, R, S commands from a phone app. Smooth acceleration, a minimum PWM for weak motors, reversing a side without rewiring, and an automatic stop when Bluetooth disconnects. Explains wiring problems in Russian, Kazakh or English. Works on Arduino AVR and ESP32. Examples included, made for classes and kits by Alash Electronics.
